<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบ POS โรงเรียนราษฎร์วิทยา</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        .logo {
            width: 150px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        h1 {
            color: #1e293b;
            margin-bottom: 10px;
            font-size: 24px;
        }
        h2 {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 40px;
            font-weight: normal;
        }
        .btn-login {
            background-color: #f59e0b;
            color: white;
            padding: 16px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: all 0.3s ease;
            display: inline-block;
        }
        .btn-login:hover {
            background-color: #d97706;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
        }
    </style>
</head>
<body>

    <img src="https://img2.pic.in.th/-127307c56423824be.png" alt="โลโก้โรงเรียน" class="logo">
    
    <h1>ระบบ POS ร้านค้าสวัสดิการ</h1>
    <h2>โรงเรียนราษฎร์วิทยา (ตี่มิ้ง)</h2>

        👉 เข้าสู่ระบบ POS
    </a>

</html>
